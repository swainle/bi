name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install uv==0.13.3
          uv sync --locked
      - name: Run pytest
        env:
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mingzebi_ci
          DEBUG: "true"
        run: uv run --locked pytest

  frontend:
    name: Frontend typecheck, unit tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
      - name: Build Storybook
        run: npm run build-storybook
      - name: Bundle budget
        run: npm run budget

  unified-image:
    name: Unified production image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mingzebi_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U ci -d mingzebi_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: |
          docker build -t mingzebi/app:ci .
          docker build --target development -t mingzebi/app:ci-test .
      - name: Verify frontend serving
        run: docker run --rm -v "$PWD/backend/tests:/tests:ro" -e PYTHONPATH=/app -e JWT_SECRET=ci-only-secret-ci-only-secret-ci-only -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/mingzebi_ci mingzebi/app:ci-test uv run --locked pytest /tests/test_frontend.py /tests/test_readiness.py /tests/test_dev.py -q -p no:cacheprovider
      - name: Verify roles and fresh database startup
        run: |
          trap 'docker logs mingzebi-ci-backend; docker logs mingzebi-ci-frontend; docker rm -f mingzebi-ci-backend mingzebi-ci-frontend; docker network rm mingzebi-ci' EXIT
          docker network create mingzebi-ci
          docker run -d --name mingzebi-ci-backend --network mingzebi-ci --add-host host.docker.internal:host-gateway \
            -e DATABASE_URL=postgresql://ci:ci@host.docker.internal:5432/mingzebi_ci \
            -e JWT_SECRET=ci-only-secret-ci-only-secret-ci-only \
            -e ADMIN_PASSWORD=TemporaryCI-123456 -e DEBUG=false \
            -e BI_ALERT_INTERVAL_SECONDS=0 -e BI_REPORT_INTERVAL_SECONDS=0 \
            -e BI_SYNC_INTERVAL_SECONDS=0 mingzebi/app:ci backend
          docker run -d --name mingzebi-ci-frontend --network mingzebi-ci -p 8080:8000 \
            -e BACKEND_URL=http://mingzebi-ci-backend:8000 mingzebi/app:ci frontend
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/api/readyz
          curl --fail http://127.0.0.1:8080/bi/canvas | grep -q '<!doctype html>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/missing)" = 404
          docker stop mingzebi-ci-backend
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/readyz)" = 502
