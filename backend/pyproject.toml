[project]
name = "mingzebi-backend"
version = "1.0.0"
description = "明策BI 后端"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "pydantic==2.7.0",
    "pydantic-settings==2.3.0",
    "email-validator==2.1.1",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "PyMySQL==1.2.4",
    "clickhouse-sqlalchemy==0.3.2",
    "clickhouse-driver==0.2.11",
    "pyodbc==5.2.0",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.1",
    "oracledb==26.1.0",
    "ibm-db-sa==0.4.4",
    "PyHive==0.7.0",
    "thrift==0.25.0",
    "thrift_sasl==0.4.3",
    "pure-sasl==0.6.2",
    "impyla==0.24.0",
    "sentry-sdk[fastapi]==2.19.2",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "openpyxl==3.1.2",
    "httpx==0.28.1",
    "requests==2.32.3",
    "websockets>=13.0",
    "structlog>=24.0.0",
    "pypinyin==0.50.0",
    "sqlglot==30.30.0",
    "redis>=5.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
dev = "app.dev:main"

[dependency-groups]
dev = ["pytest>=9.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
