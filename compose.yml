# ─────────────────────────────────────────────────────────────
# 明策BI · 一键启动（生产：同一镜像分 frontend / backend / worker 角色）
#   docker compose up -d --build
#   前端 http://localhost:5300   后端 http://localhost:8300/api/health
#   数据库宿主机端口 5433（避开本机 5432）
# ─────────────────────────────────────────────────────────────
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mingzebi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mingzebi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      POSTGRES_DB: mingzebi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mingzebi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mingzebi -d mingzebi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mingzebi-redis
    restart: unless-stopped
    # 只给后端用，不映射到宿主机；掉电只丢缓存，不影响数据
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    image: ${MINGZEBI_IMAGE:-mingzebi/app:local}
    command: ["backend"]
    container_name: mingzebi-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mingzebi:${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}@db:5432/mingzebi
      JWT_SECRET: ${JWT_SECRET:?请先设置 JWT_SECRET（openssl rand -base64 48）}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}
      DEBUG: "false"
      # Redis 不可用时后端自动回退进程内缓存，不阻塞启动
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # 整页渲染结果短时缓存（秒，0 = 关闭）
      BI_RENDER_CACHE_TTL: ${BI_RENDER_CACHE_TTL:-15}
      # 异步任务表：auto = 能用 Redis 就多 worker 共享，否则进程内
      BI_JOB_STORE: ${BI_JOB_STORE:-auto}
      BI_ASYNC_WORKERS: ${BI_ASYNC_WORKERS:-2}
      # 异步任务执行方式：inline（默认，API 进程内）/ worker（独立 worker 容器）
      BI_JOB_EXECUTOR: ${BI_JOB_EXECUTOR:-worker}
      # 错误上报（可选）：留空 = 不启用；填了 DSN 后接口异常自动上报
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # 连接池（单 worker 默认 20 + 10；生产分角色部署见 docs/统一镜像部署.md）
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      BI_RENDER_MAX_THREADS: ${BI_RENDER_MAX_THREADS:-10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-12}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-6}
    ports:
      - "127.0.0.1:8300:8000"
    volumes:
      - mingzebi_uploads:/app/uploads
      - mingzebi_reports:/app/var/reports


  frontend:
    image: ${MINGZEBI_IMAGE:-mingzebi/app:local}
    command: ["frontend"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5300:8000"
    environment:
      BACKEND_URL: http://backend:8000

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    image: ${MINGZEBI_IMAGE:-mingzebi/app:local}
    container_name: mingzebi-worker
    restart: unless-stopped
    command: ["worker"]
    healthcheck:
      disable: true
    volumes:
      - mingzebi_uploads:/app/uploads
      - mingzebi_reports:/app/var/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mingzebi:${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}@db:5432/mingzebi
      JWT_SECRET: ${JWT_SECRET:?请先设置 JWT_SECRET（openssl rand -base64 48）}
      DEBUG: "false"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BI_JOB_STORE: ${BI_JOB_STORE:-auto}
      BI_JOB_EXECUTOR: worker
      # worker 只需要 4 条连接就够（同一时刻只跑一个查询）
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-2}
      BI_ASYNC_MAX_ATTEMPTS: ${BI_ASYNC_MAX_ATTEMPTS:-2}
      BI_WORKER_POLL_SECONDS: "1"
      BI_SLOW_SAMPLE_MS: ${BI_SLOW_SAMPLE_MS:-1000}

volumes:
  mingzebi_pgdata:
  mingzebi_uploads:
  mingzebi_reports:
