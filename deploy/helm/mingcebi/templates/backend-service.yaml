apiVersion: v1
kind: Service
metadata:
  name: {{ include "mingcebi.fullname" . }}-backend
  labels:
    {{- include "mingcebi.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
  selector:
    {{- include "mingcebi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
