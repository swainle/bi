{{- if not .Values.backend.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mingcebi.fullname" . }}
  labels:
    {{- include "mingcebi.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "backend.secrets.DATABASE_URL 必填（或改用 backend.existingSecret）" .Values.backend.secrets.DATABASE_URL | quote }}
  JWT_SECRET: {{ required "backend.secrets.JWT_SECRET 必填（或改用 backend.existingSecret）" .Values.backend.secrets.JWT_SECRET | quote }}
  {{- with .Values.backend.secrets.LLM_API_KEY }}
  LLM_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.secrets.ADMIN_PASSWORD }}
  ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
