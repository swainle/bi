apiVersion: v1
kind: Service
metadata:
  name: {{ include "mingzebi.fullname" . }}-backend
  labels:
    {{- include "mingzebi.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
  selector:
    {{- include "mingzebi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
